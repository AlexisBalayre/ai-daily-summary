<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hot GitHub Repositories - By Alexis Balayre</title>
    <!--[if mso]>
      <style type="text/css">
        table {
          border-collapse: collapse;
          border-spacing: 0;
          margin: 0;
        }
        div,
        td {
          padding: 0;
        }
        div {
          margin: 0 !important;
        }
      </style>
    <![endif]-->
    <style type="text/css">
      /* Base styles */
      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      }

      /* Reset styles for email clients */
      img {
        -ms-interpolation-mode: bicubic;
        border: 0;
        height: auto;
        line-height: 100%;
        outline: none;
        text-decoration: none;
      }

      table {
        border-collapse: collapse !important;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }

      /* Main styles */
      .container {
        width: 100%;
        max-width: 600px;
        background-color: #ffffff;
      }

      .content {
        padding: 30px;
      }

      .header {
        padding-bottom: 20px;
        border-bottom: 2px solid #e1e4e8;
      }

      h1, h2 {
        color: #24292e;
        font-size: 24px;
        font-weight: 600;
        margin: 0;
        padding: 0;
      }

      .section-title {
        color: #24292e;
        font-size: 20px;
        font-weight: 600;
        margin: 25px 0 15px 0;
        padding: 0;
      }

      .repository {
        padding: 15px;
        margin: 15px 0;
        border: 1px solid #e1e4e8;
        border-radius: 6px;
      }

      .repository-title {
        color: #0366d6;
        font-weight: 600;
        font-size: 16px;
        text-decoration: none;
      }

      .repository-description {
        color: #586069;
        font-size: 14px;
        line-height: 1.5;
        margin: 8px 0;
      }

      .repository-stats {
        color: #586069;
        font-size: 12px;
      }

      .language-tag {
        display: inline-block;
        padding: 2px 8px;
        background-color: #0366d6;
        color: #ffffff;
        border-radius: 12px;
        font-size: 12px;
        margin: 4px 0;
      }

      .stat {
        display: inline-block;
        margin-right: 15px;
        color: #586069;
      }

      .footer {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #e1e4e8;
        text-align: center;
        color: #586069;
        font-size: 12px;
      }

      /* Mobile responsive styles */
      @media screen and (max-width: 600px) {
        .content {
          padding: 15px !important;
        }

        .repository {
          padding: 10px !important;
        }
      }
    </style>
  </head>
  <body>
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td align="center" style="padding: 20px 0">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            width="600"
            class="container"
          >
            <tr>
              <td class="content">
                <div class="header">
                  <h1>Hot GitHub Repositories</h1>
                  <div
                    style="color: #586069; font-size: 14px; margin-top: 10px"
                  >
                    {{date}}
                  </div>
                </div>

                <div class="section-title">
                  <table
                    role="presentation"
                    cellpadding="0"
                    cellspacing="0"
                    width="100%"
                  >
                    <tr>
                      <td><h2>🔥 Trending Repositories</h2></td>
                    </tr>
                  </table>
                </div>
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  width="100%"
                >
                  <tr>
                    <td>{{trending_repositories}}</td>
                  </tr>
                </table>

                <div class="section-title">
                  <table
                    role="presentation"
                    cellpadding="0"
                    cellspacing="0"
                    width="100%"
                  >
                    <tr>
                      <td><h2>⭐ Featured Discoveries</h2></td>
                    </tr>
                  </table>
                </div>
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  width="100%"
                >
                  <tr>
                    <td>{{explore_repositories}}</td>
                  </tr>
                </table>

                <div class="footer">
                  &copy; {{year}} Alexis Balayre Hot GitHub Repositories
                  Newsletter. All rights reserved.
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
