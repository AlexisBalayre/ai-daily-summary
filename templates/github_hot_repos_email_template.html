<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Hot Repos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style type="text/css">
      /* Reset & Base */
      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        background: linear-gradient(135deg, #f0f6fc 0%, #e8f0f8 100%);
        font-family: 'DM Sans', -apple-system, sans-serif;
      }

      /* CSS Variables */
      :root {
        --bg-white: #ffffff;
        --bg-light: #f6f8fa;
        --bg-blue-tint: #f0f6fc;
        --accent-blue: #0969da;
        --accent-blue-light: #ddf4ff;
        --accent-purple: #8250df;
        --accent-purple-light: #fbefff;
        --accent-orange: #bf5700;
        --accent-orange-light: #fff8f2;
        --accent-green: #1a7f37;
        --accent-green-light: #dafbe1;
        --text-dark: #1f2328;
        --text-body: #424a53;
        --text-muted: #6e7781;
        --border-default: #d1d9e0;
        --border-muted: #e4e8ec;
      }

      /* Email wrapper */
      .email-wrapper {
        background: linear-gradient(135deg, #f0f6fc 0%, #e8f0f8 100%);
        padding: 40px 20px;
      }

      /* Main container */
      .container {
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
        background: var(--bg-white);
        border-radius: 12px;
        overflow: hidden;
        box-shadow:
          0 1px 3px rgba(31, 35, 40, 0.04),
          0 8px 24px rgba(31, 35, 40, 0.08);
        border: 1px solid var(--border-muted);
      }

      /* Header */
      .header {
        background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-blue-tint) 100%);
        padding: 40px 40px 36px;
        border-bottom: 1px solid var(--border-default);
        position: relative;
        text-align: center;
      }

      .header::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--accent-orange), var(--accent-purple), var(--accent-blue));
      }

      .logo-container {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 20px;
        background: var(--bg-white);
        padding: 12px 20px;
        border-radius: 50px;
        border: 1px solid var(--border-default);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }

      .fire-icon {
        font-size: 24px;
        filter: drop-shadow(0 2px 4px rgba(191, 87, 0, 0.3));
      }

      .logo-text {
        font-family: 'Outfit', -apple-system, sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--accent-orange);
      }

      .main-title {
        font-family: 'Outfit', -apple-system, sans-serif;
        font-size: 32px;
        font-weight: 700;
        color: var(--text-dark);
        margin: 0 0 12px;
        letter-spacing: -0.5px;
      }

      .subtitle {
        font-family: 'DM Sans', sans-serif;
        font-size: 15px;
        color: var(--text-muted);
        margin: 0 0 20px;
        line-height: 1.5;
      }

      /* Date badge */
      .date-badge {
        display: inline-block;
        font-family: 'Fira Code', monospace;
        font-size: 12px;
        font-weight: 500;
        color: var(--accent-blue);
        background: var(--accent-blue-light);
        padding: 10px 18px;
        border-radius: 8px;
        border: 1px solid rgba(9, 105, 218, 0.2);
        letter-spacing: 1px;
      }

      /* Stats bar */
      .stats-bar {
        display: flex;
        justify-content: center;
        gap: 24px;
        padding: 16px 40px;
        background: var(--bg-light);
        border-bottom: 1px solid var(--border-muted);
      }

      .stat-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        color: var(--text-muted);
        letter-spacing: 0.5px;
      }

      .stat-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-green);
      }

      /* Repos section */
      .repos-section {
        padding: 32px 40px;
      }

      /* Repo card */
      .repo-card {
        background: var(--bg-light);
        border: 1px solid var(--border-default);
        border-radius: 12px;
        padding: 24px;
        margin: 16px 0;
        position: relative;
        transition: all 0.2s ease;
      }

      .repo-card:hover {
        border-color: var(--accent-blue);
        box-shadow: 0 4px 12px rgba(9, 105, 218, 0.08);
      }

      .repo-rank {
        position: absolute;
        top: -10px;
        right: 20px;
        font-family: 'Outfit', sans-serif;
        font-size: 11px;
        font-weight: 700;
        color: var(--accent-purple);
        background: var(--accent-purple-light);
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid rgba(130, 80, 223, 0.2);
        letter-spacing: 1px;
      }

      .repo-name {
        font-family: 'Outfit', sans-serif;
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 12px 0;
        line-height: 1.3;
      }

      .repo-name a {
        color: var(--accent-blue);
        text-decoration: none;
        transition: color 0.2s;
      }

      .repo-name a:hover {
        color: var(--accent-purple);
        text-decoration: underline;
      }

      .repo-desc {
        font-family: 'DM Sans', sans-serif;
        font-size: 14px;
        color: var(--text-body);
        line-height: 1.65;
        margin: 0 0 18px 0;
        padding-left: 14px;
        border-left: 3px solid var(--border-default);
      }

      .repo-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        font-family: 'Fira Code', monospace;
        font-size: 12px;
      }

      .meta-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 6px;
        font-weight: 500;
      }

      .meta-lang {
        color: var(--accent-blue);
        background: var(--accent-blue-light);
        border: 1px solid rgba(9, 105, 218, 0.15);
      }

      .meta-stars {
        color: var(--accent-orange);
        background: var(--accent-orange-light);
        border: 1px solid rgba(191, 87, 0, 0.15);
      }

      .meta-forks {
        color: var(--accent-green);
        background: var(--accent-green-light);
        border: 1px solid rgba(26, 127, 55, 0.15);
      }

      .meta-icon {
        font-size: 13px;
      }

      /* Footer */
      .footer {
        background: var(--bg-light);
        border-top: 1px solid var(--border-default);
        padding: 32px 40px;
        text-align: center;
      }

      .footer-cta {
        display: inline-block;
        font-family: 'Outfit', sans-serif;
        font-size: 13px;
        font-weight: 600;
        color: var(--bg-white);
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        letter-spacing: 0.5px;
        margin-bottom: 20px;
        box-shadow: 0 4px 12px rgba(9, 105, 218, 0.25);
        transition: all 0.2s;
      }

      .footer-cta:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(9, 105, 218, 0.3);
      }

      .footer-divider {
        width: 60px;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--border-default), transparent);
        margin: 20px auto;
      }

      .footer-brand {
        font-family: 'DM Sans', sans-serif;
        font-size: 12px;
        color: var(--text-muted);
        margin: 0;
      }

      .footer-brand strong {
        color: var(--accent-purple);
        font-weight: 600;
      }

      .footer-copy {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        color: var(--text-muted);
        margin: 8px 0 0;
      }

      /* Responsive */
      @media only screen and (max-width: 600px) {
        .header { padding: 32px 24px 28px; }
        .main-title { font-size: 26px; }
        .stats-bar { padding: 14px 24px; gap: 16px; }
        .repos-section { padding: 24px; }
        .repo-card { padding: 20px; }
        .footer { padding: 24px; }
      }
    </style>
  </head>
  <body>
    <div class="email-wrapper">
      <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
        <tr>
          <td align="center">
            <table role="presentation" cellpadding="0" cellspacing="0" width="640" class="container">
              <tr>
                <td>
                  <!-- Header -->
                  <div class="header">
                    <div class="logo-container">
                      <span class="fire-icon">&#128293;</span>
                      <span class="logo-text">Hot Repos</span>
                    </div>
                    <h1 class="main-title">GitHub Trending</h1>
                    <p class="subtitle">Today's trending and noteworthy repositories from the developer community.</p>
                    <div class="date-badge">{{date}}</div>
                  </div>

                  <!-- Stats bar -->
                  <div class="stats-bar">
                    <span class="stat-item">
                      <span class="stat-dot"></span>
                      LIVE FEED
                    </span>
                    <span class="stat-item">
                      CURATED BY AI DAILY
                    </span>
                  </div>

                  <!-- Repos -->
                  <div class="repos-section">
                    {{repos}}
                  </div>

                  <!-- Footer -->
                  <div class="footer">
                    <a href="https://github.com/trending" class="footer-cta">View All on GitHub &rarr;</a>
                    <div class="footer-divider"></div>
                    <p class="footer-brand">Curated by <strong>AI Daily</strong></p>
                    <p class="footer-copy">&copy; {{year}} Alexis Balayre</p>
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
