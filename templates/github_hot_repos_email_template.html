<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Hot Repos</title>
    <style type="text/css">
      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        background-color: #0d1117;
      }
      .container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        background-color: #161b22;
      }
      .content {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        padding: 20px;
        color: #c9d1d9;
      }
      h1 {
        color: #58a6ff;
        font-size: 24px;
        margin-top: 0;
        padding-bottom: 15px;
        border-bottom: 1px solid #30363d;
      }
      h2 {
        color: #c9d1d9;
        font-size: 18px;
        margin-top: 25px;
        margin-bottom: 15px;
      }
      .repo-card {
        background-color: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 16px;
        margin: 12px 0;
      }
      .repo-name {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 8px 0;
      }
      .repo-name a {
        color: #58a6ff;
        text-decoration: none;
      }
      .repo-desc {
        color: #8b949e;
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 12px 0;
      }
      .repo-meta {
        font-size: 12px;
        color: #8b949e;
      }
      .repo-meta span {
        margin-right: 16px;
      }
      .footer {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #30363d;
        color: #8b949e;
        font-size: 12px;
        text-align: center;
      }
      .footer a {
        color: #58a6ff;
      }
    </style>
  </head>
  <body>
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: #0d1117;">
      <tr>
        <td align="center" style="padding: 20px 0">
          <table role="presentation" cellpadding="0" cellspacing="0" width="600" class="container">
            <tr>
              <td class="content">
                <h1>🔥 GitHub Hot Repos - {{date}}</h1>
                <p style="color: #8b949e; font-size: 14px;">
                  Today's trending and noteworthy repositories from the developer community.
                </p>
                {{repos}}
                <div class="footer">
                  <p>Curated by AI Daily • <a href="https://github.com/trending">View on GitHub</a></p>
                  <p>&copy; {{year}} Alexis Balayre. All rights reserved.</p>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
