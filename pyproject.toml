[project]
name = "ai-daily-summary"
version = "0.2.0"
description = "AI-powered daily summary and newsletter generation platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Alexis Balayre", email = "60859013+AlexisBal@users.noreply.github.com" }
]
dependencies = [
    # Core
    "python-dotenv>=1.0.1",
    "openai>=1.60.2",
    "aiohttp>=3.11.12",
    "requests>=2.32.3",
    "beautifulsoup4>=4.13.3",
    "croniter>=2.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pgvector>=0.2.4",
    # Gmail API
    "google-api-python-client>=2.159.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    # API & CLI
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    # TTS
    "pocket-tts>=0.1.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
ai-daily = "ai_daily.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_daily"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
