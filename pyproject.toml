[project]
name = "ai-daily-summary"
version = "0.2.0"
description = "AI-powered daily summary and newsletter generation platform"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Alexis Balayre", email = "60859013+AlexisBal@users.noreply.github.com" }
]
keywords = ["newsletter", "rss", "gmail", "llm", "gemini", "pgvector", "fastapi", "tts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    # Core
    "python-dotenv>=1.0.1",
    "google-genai>=1.0.0",
    "aiohttp>=3.11.12",
    "requests>=2.32.3",
    "beautifulsoup4>=4.13.3",
    "feedparser>=6.0.0",
    "trafilatura>=1.6.0",
    "croniter>=2.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pgvector>=0.2.4",
    # Gmail API
    "google-api-python-client>=2.159.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    # API & CLI
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
# Headless browser for client-rendered leaderboards (pulls Chromium via `playwright install`).
leaderboards = ["playwright>=1.40"]
# Spoken audio briefing.
tts = ["pocket-tts>=0.1.0", "scipy>=1.12.0"]
all = ["ai-daily-summary[leaderboards,tts]"]

[project.urls]
Homepage = "https://github.com/AlexisBalayre/ai-daily-summary"
Repository = "https://github.com/AlexisBalayre/ai-daily-summary"
Issues = "https://github.com/AlexisBalayre/ai-daily-summary/issues"

[project.scripts]
ai-daily = "ai_daily.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_daily"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes, I: isort, UP: pyupgrade, B: bugbear,
# DTZ: flag naive datetimes (catches datetime.utcnow()), SIM: simplify, LOG: logging.
select = ["E", "F", "I", "UP", "B", "DTZ", "SIM", "LOG"]
# Line length is enforced by the formatter, not the linter.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query() in defaults is the framework's idiom (B008).
"ai_daily/api/**" = ["B008"]
# Tests may keep broad constructs and nested `with patch(...)` blocks; Alembic scaffolding is generated.
"tests/**" = ["B", "SIM117"]
"ai_daily/db/migrations/**" = ["E", "F", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.6.0",
]
