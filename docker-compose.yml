# AI Daily Summary - Data Platform
# Docker Compose configuration for PostgreSQL + pgvector, Ollama, and the AI Daily app

services:
  # Ollama for local LLM and embeddings
  ollama:
    image: ollama/ollama:latest
    container_name: ai-daily-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-daily-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # PostgreSQL database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-daily-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-ai_daily}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-daily-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ai_daily}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Daily application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-daily-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      # Database configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ai_daily}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # LLM configuration (defaults to Ollama for local deployment)
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      # Gmail configuration (required for email sending)
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_PROJECT_ID: ${GMAIL_PROJECT_ID}
      # Newsletter configuration
      RECIPIENTS: ${RECIPIENTS}
      # Path configuration
      DATA_DIR: /app/data
      LOGS_DIR: /app/logs
      TEMPLATES_DIR: /app/templates
      CONFIG_FILE: /app/config.json
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      # Mount Gmail token if using OAuth (optional)
      - ./token.json:/app/token.json:ro
    networks:
      - ai-daily-network

networks:
  ai-daily-network:
    driver: bridge

volumes:
  postgres_data:
    name: ai-daily-postgres-data
  ollama_data:
    name: ai-daily-ollama-data
  app_data:
    name: ai-daily-app-data
  app_logs:
    name: ai-daily-app-logs
